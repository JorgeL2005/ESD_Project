<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Emitir Voto</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>
  <div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h1>Emitir Voto</h1>
      <div><button id="logoutBtn" type="button" onclick="logoutUser()">Cerrar sesión</button></div>
    </div>
    <div class="card">
      <p>Usuario: <span id="userLabel"></span> | Rol: <span id="roleLabel"></span></p>
      <label>Clave privada (PKCS8 PEM) del usuario</label>
      <div style="margin-top:6px">
        <button id="pasteKeyBtn" type="button">Ingresar / Pegar PRIMARY KEY</button>
        <button id="uploadFileBtn" type="button">Cargar archivo .txt</button>
        <input id="uploadKeyInput" type="file" accept=".txt,.pem,text/plain" style="display:none;" />
      </div>
      <div id="keyContainer" style="margin-top:8px; display:none;"></div>
      <label>Voto</label>
      <label>Seleccione un candidato</label>
      <select id="candidateSelect"></select>

      <button id="sendVote">Enviar voto cifrado y firmado</button>
      <p id="voteMsg" class="msg"></p>
    </div>
  </div>
  <script src="/static/js/util.js"></script>
  <script src="/static/js/vote.js"></script>
</body>
</html>
